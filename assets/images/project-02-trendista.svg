<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="trendBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f1d"/>
      <stop offset="100%" stop-color="#081412"/>
    </linearGradient>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#1F9A55"/>
    </linearGradient>
    <linearGradient id="pptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C43E1C"/>
      <stop offset="100%" stop-color="#D8562E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#trendBg)"/>
  <rect width="800" height="450" fill="none" stroke="#1d3833" stroke-width="2"/>

  <!-- Excel & PowerPoint Co-Header Ribbon -->
  <g transform="translate(25, 25)">
    <rect width="750" height="52" rx="8" fill="#142c27" stroke="#1f443c" stroke-width="1"/>
    <!-- Excel Badge -->
    <rect x="18" y="12" width="28" height="28" rx="6" fill="url(#excelGreen)"/>
    <text x="32" y="32" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">X</text>
    <!-- PPT Badge -->
    <rect x="52" y="12" width="28" height="28" rx="6" fill="url(#pptOrange)"/>
    <text x="66" y="32" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">P</text>

    <text x="92" y="32" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="15" font-weight="600">Trendista Retail Intelligence · SKU Velocity &amp; Strategy Deck</text>
    <rect x="635" y="14" width="95" height="24" rx="12" fill="#1F9A55" fill-opacity="0.2" stroke="#1F9A55" stroke-width="1"/>
    <text x="682" y="30" fill="#4ade80" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sept 2025 Audit</text>
  </g>

  <!-- Left: Spreadsheet Data Analysis Model -->
  <g transform="translate(25, 95)">
    <rect width="450" height="330" rx="8" fill="#142c27" stroke="#1f443c" stroke-width="1"/>
    <!-- Spreadsheet Formula Bar -->
    <rect x="15" y="15" width="420" height="30" rx="4" fill="#0d1f1c" stroke="#1d3f37" stroke-width="1"/>
    <text x="25" y="34" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">fx</text>
    <text x="48" y="34" fill="#9ca3af" font-family="monospace" font-size="11">=XLOOKUP(SKU_ID, Inventory[SKU], Sales[Revenue]*Margin_Rate)</text>

    <!-- Spreadsheet Table Header -->
    <rect x="15" y="55" width="420" height="26" fill="#1e463d"/>
    <text x="25" y="72" fill="#a7f3d0" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600">SKU CATEGORY</text>
    <text x="145" y="72" fill="#a7f3d0" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600">UNITS SOLD</text>
    <text x="245" y="72" fill="#a7f3d0" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600">SELL-THROUGH</text>
    <text x="360" y="72" fill="#a7f3d0" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600">MARGIN</text>

    <!-- Table Rows -->
    <!-- Row 1 -->
    <rect x="15" y="83" width="420" height="28" fill="#112722"/>
    <text x="25" y="101" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11">Apparel · Premium Denim</text>
    <text x="150" y="101" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="11">14,280</text>
    <rect x="245" y="93" width="65" height="10" rx="5" fill="#091714"/>
    <rect x="245" y="93" width="55" height="10" rx="5" fill="#10B981"/>
    <text x="320" y="102" fill="#4ade80" font-family="'Hanken Grotesk', sans-serif" font-size="10">84%</text>
    <text x="365" y="101" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">58.4%</text>

    <!-- Row 2 -->
    <rect x="15" y="113" width="420" height="28" fill="#142c27"/>
    <text x="25" y="131" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11">Footwear · Eco Runners</text>
    <text x="150" y="131" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="11">9,410</text>
    <rect x="245" y="123" width="65" height="10" rx="5" fill="#091714"/>
    <rect x="245" y="123" width="48" height="10" rx="5" fill="#10B981"/>
    <text x="320" y="132" fill="#4ade80" font-family="'Hanken Grotesk', sans-serif" font-size="10">72%</text>
    <text x="365" y="131" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">52.1%</text>

    <!-- Row 3 -->
    <rect x="15" y="143" width="420" height="28" fill="#112722"/>
    <text x="25" y="161" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11">Accessories · Leather Goods</text>
    <text x="150" y="161" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="11">6,890</text>
    <rect x="245" y="153" width="65" height="10" rx="5" fill="#091714"/>
    <rect x="245" y="153" width="61" height="10" rx="5" fill="#10B981"/>
    <text x="320" y="162" fill="#4ade80" font-family="'Hanken Grotesk', sans-serif" font-size="10">92%</text>
    <text x="365" y="161" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">64.0%</text>

    <!-- Row 4 -->
    <rect x="15" y="173" width="420" height="28" fill="#142c27"/>
    <text x="25" y="191" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11">Seasonal Outerwear</text>
    <text x="150" y="191" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="11">4,120</text>
    <rect x="245" y="183" width="65" height="10" rx="5" fill="#091714"/>
    <rect x="245" y="183" width="32" height="10" rx="5" fill="#F59E0B"/>
    <text x="320" y="192" fill="#fde047" font-family="'Hanken Grotesk', sans-serif" font-size="10">48%</text>
    <text x="365" y="191" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">41.8%</text>

    <!-- Pivot Chart Miniature -->
    <rect x="15" y="215" width="420" height="100" rx="6" fill="#0e221e" stroke="#1d3f37" stroke-width="1"/>
    <text x="28" y="234" fill="#a7f3d0" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">Quarterly Inventory Velocity Index</text>
    <!-- Bar chart -->
    <rect x="40" y="260" width="40" height="40" rx="3" fill="#1F9A55"/>
    <rect x="110" y="250" width="40" height="50" rx="3" fill="#1F9A55"/>
    <rect x="180" y="240" width="40" height="60" rx="3" fill="#10B981"/>
    <rect x="250" y="245" width="40" height="55" rx="3" fill="#10B981"/>
    <rect x="320" y="235" width="40" height="65" rx="3" fill="#34d399"/>
    <text x="60" y="310" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Q1</text>
    <text x="130" y="310" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Q2</text>
    <text x="200" y="310" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Q3</text>
    <text x="270" y="310" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Q4</text>
    <text x="340" y="310" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Projected</text>
  </g>

  <!-- Right: Executive Strategy Presentation Deck Card -->
  <g transform="translate(495, 95)">
    <rect width="280" height="330" rx="8" fill="#142c27" stroke="#1f443c" stroke-width="1"/>
    <!-- Slide Header -->
    <rect x="15" y="15" width="250" height="150" rx="6" fill="#1c3d35" stroke="#255248" stroke-width="1"/>
    <rect x="15" y="15" width="250" height="24" rx="6" fill="#C43E1C"/>
    <text x="25" y="31" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="700">EXECUTIVE STRATEGY DECK</text>
    <text x="25" y="60" fill="#FFFFFF" font-family="'Newsreader', serif" font-size="14" font-weight="600">Trendista Retail Findings</text>
    <text x="25" y="78" fill="#d1fae5" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="500">Key Merchandising Decisions:</text>
    <circle cx="30" cy="98" r="2.5" fill="#4ade80"/>
    <text x="40" y="101" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10">Reallocate 18% inventory to Denim</text>
    <circle cx="30" cy="116" r="2.5" fill="#4ade80"/>
    <text x="40" y="119" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10">Discount outer-wear in low-margin zones</text>
    <circle cx="30" cy="134" r="2.5" fill="#4ade80"/>
    <text x="40" y="137" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10">Introduce digital loyalty touchpoints</text>

    <!-- Strategy Summary Callout -->
    <rect x="15" y="180" width="250" height="135" rx="6" fill="#0d1f1c" stroke="#1d3f37" stroke-width="1"/>
    <text x="25" y="202" fill="#4ade80" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700">BUSINESS IMPACT FRAMEWORK</text>
    <text x="25" y="222" fill="#e5e7eb" font-family="'Hanken Grotesk', sans-serif" font-size="10" line-height="1.4">Synthesizing quantitative spreadsheet mechanics with board-level storytelling.</text>
    <rect x="25" y="245" width="230" height="1" fill="#1f443c"/>
    <text x="25" y="265" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9">Deliverable Format:</text>
    <text x="25" y="280" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600">Structured Excel Model + 24-Slide Deck</text>
    <rect x="25" y="293" width="70" height="15" rx="3" fill="#1F9A55"/>
    <text x="60" y="304" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Live Link Active</text>
  </g>
</svg>