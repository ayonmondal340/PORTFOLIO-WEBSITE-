<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2521"/>
      <stop offset="100%" stop-color="#181513"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c275"/>
      <stop offset="100%" stop-color="#a88534"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#parchmentBg)"/>

  <!-- Vintage Print Border Frame -->
  <rect x="25" y="25" width="750" height="400" fill="#201c19" stroke="url(#goldBrass)" stroke-width="1.5"/>
  <rect x="33" y="33" width="734" height="384" fill="none" stroke="#443c36" stroke-width="1"/>

  <!-- Corner Flourishes -->
  <circle cx="33" cy="33" r="4" fill="url(#goldBrass)"/>
  <circle cx="767" cy="33" r="4" fill="url(#goldBrass)"/>
  <circle cx="33" cy="417" r="4" fill="url(#goldBrass)"/>
  <circle cx="767" cy="417" r="4" fill="url(#goldBrass)"/>

  <!-- Editorial Masthead Header -->
  <text x="400" y="75" fill="#a88534" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">MADISON AVENUE ARCHIVES · CIRCA 1963</text>
  <line x1="120" y1="88" x2="680" y2="88" stroke="url(#goldBrass)" stroke-width="1"/>

  <!-- Iconic Vintage Headline Display -->
  <text x="400" y="145" fill="#f5ede0" font-family="'Newsreader', Georgia, serif" font-size="34" font-style="italic" font-weight="400" text-anchor="middle">
    “The Consumer Isn’t a Moron;
  </text>
  <text x="400" y="195" fill="#f5ede0" font-family="'Newsreader', Georgia, serif" font-size="34" font-weight="600" text-anchor="middle">
    She Is Your Wife.”
  </text>

  <!-- Editorial Column Layout Representation -->
  <g transform="translate(100, 220)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="180" height="120" fill="#181513" stroke="#3d352e" stroke-width="1" rx="4"/>
    <text x="15" y="24" fill="#e2c275" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="700">RULE I: RESEARCH FIRST</text>
    <line x1="15" y1="36" x2="165" y2="36" stroke="#4a3f36" stroke-width="1"/>
    <line x1="15" y1="52" x2="165" y2="52" stroke="#4a3f36" stroke-width="1"/>
    <line x1="15" y1="68" x2="165" y2="68" stroke="#4a3f36" stroke-width="1"/>
    <line x1="15" y1="84" x2="135" y2="84" stroke="#4a3f36" stroke-width="1"/>
    <text x="15" y="105" fill="#9c8e80" font-family="'Newsreader', serif" font-size="10" font-style="italic">Rigorous fact discovery</text>

    <!-- Column 2 -->
    <rect x="210" y="0" width="180" height="120" fill="#181513" stroke="#3d352e" stroke-width="1" rx="4"/>
    <text x="225" y="24" fill="#e2c275" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="700">RULE II: THE HEADLINE</text>
    <line x1="225" y1="36" x2="375" y2="36" stroke="#4a3f36" stroke-width="1"/>
    <line x1="225" y1="52" x2="375" y2="52" stroke="#4a3f36" stroke-width="1"/>
    <line x1="225" y1="68" x2="375" y2="68" stroke="#4a3f36" stroke-width="1"/>
    <line x1="225" y1="84" x2="345" y2="84" stroke="#4a3f36" stroke-width="1"/>
    <text x="225" y="105" fill="#9c8e80" font-family="'Newsreader', serif" font-size="10" font-style="italic">80 cents of your dollar</text>

    <!-- Column 3 -->
    <rect x="420" y="0" width="180" height="120" fill="#181513" stroke="#3d352e" stroke-width="1" rx="4"/>
    <text x="435" y="24" fill="#e2c275" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="700">RULE III: BRAND MOATS</text>
    <line x1="435" y1="36" x2="585" y2="36" stroke="#4a3f36" stroke-width="1"/>
    <line x1="435" y1="52" x2="585" y2="52" stroke="#4a3f36" stroke-width="1"/>
    <line x1="435" y1="68" x2="585" y2="68" stroke="#4a3f36" stroke-width="1"/>
    <line x1="435" y1="84" x2="555" y2="84" stroke="#4a3f36" stroke-width="1"/>
    <text x="435" y="105" fill="#9c8e80" font-family="'Newsreader', serif" font-size="10" font-style="italic">Personality sells value</text>
  </g>

  <!-- Article Footer Stamp -->
  <rect x="310" y="365" width="180" height="26" rx="4" fill="#a88534" fill-opacity="0.15" stroke="#a88534" stroke-width="1"/>
  <text x="400" y="382" fill="#e2c275" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OCTOBER 1, 2026 · ARCHIVE</text>
</svg>