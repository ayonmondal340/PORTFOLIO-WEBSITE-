<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e1a"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="humanWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="aiCold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Left: Organic Human Creative Hemisphere -->
  <g transform="translate(140, 60)">
    <!-- Organic Swirls & Painterly Neurons -->
    <path d="M 230 40 C 160 30 110 70 90 120 C 70 170 80 230 130 270 C 170 300 230 310 240 310" fill="none" stroke="url(#humanWarm)" stroke-width="4" filter="url(#glow2)"/>
    <path d="M 230 70 C 180 65 140 100 130 140 C 120 180 130 220 170 250 C 200 270 230 280 235 280" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
    <path d="M 230 110 C 200 110 170 130 160 160 C 150 190 170 220 200 235 C 220 245 230 250 235 250" fill="none" stroke="#F59E0B" stroke-width="2"/>

    <!-- Creative Sparks -->
    <circle cx="110" cy="100" r="5" fill="#F43F5E" filter="url(#glow2)"/>
    <circle cx="85" cy="190" r="6" fill="#F59E0B" filter="url(#glow2)"/>
    <circle cx="160" cy="270" r="5" fill="#E11D48"/>
    <circle cx="190" cy="80" r="4" fill="#FBBF24"/>

    <text x="140" y="345" fill="#F97316" font-family="'Newsreader', serif" font-size="16" font-weight="600" text-anchor="middle">Intuition &amp; Emotion</text>
  </g>

  <!-- Central Dialectic Divider -->
  <line x1="400" y1="70" x2="400" y2="350" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="400" cy="210" r="14" fill="#1e293b" stroke="#FFFFFF" stroke-width="2"/>
  <text x="400" y="215" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="800" text-anchor="middle">VS</text>

  <!-- Right: Digital Neural Matrix (AI Computation) -->
  <g transform="translate(420, 60)">
    <!-- Neural Grid Architecture -->
    <path d="M 20 40 L 90 40 L 150 80 L 170 140 L 160 210 L 120 270 L 40 310 L 10 310" fill="none" stroke="url(#aiCold)" stroke-width="4" filter="url(#glow2)"/>
    <path d="M 20 80 L 70 80 L 110 120 L 120 180 L 90 240 L 20 270" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 20 130 L 60 130 L 80 170 L 60 210 L 20 230" fill="none" stroke="#818CF8" stroke-width="2"/>

    <!-- Binary & Network Nodes -->
    <line x1="20" y1="80" x2="90" y2="40" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="70" y1="80" x2="120" y2="180" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="110" y1="120" x2="160" y2="210" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="80" y1="170" x2="120" y2="270" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Glowing Synapse Nodes -->
    <circle cx="90" cy="40" r="5" fill="#00D2FF" filter="url(#glow2)"/>
    <circle cx="150" cy="80" r="6" fill="#3B82F6" filter="url(#glow2)"/>
    <circle cx="170" cy="140" r="5" fill="#6366F1"/>
    <circle cx="120" cy="180" r="4" fill="#00D2FF"/>
    <circle cx="120" cy="270" r="5" fill="#3B82F6"/>

    <text x="120" y="345" fill="#38BDF8" font-family="'Hanken Grotesk', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Algorithmic Syntax</text>
  </g>

  <!-- Editorial Subtitle Tag -->
  <rect x="290" y="380" width="220" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="400" y="398" fill="#F8FAFC" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OCTOBER 6, 2026 · ESSAY</text>
</svg>