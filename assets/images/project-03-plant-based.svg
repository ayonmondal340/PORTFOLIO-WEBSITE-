<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f231d"/>
      <stop offset="100%" stop-color="#11140f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefefe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="oatLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faeed4"/>
      <stop offset="100%" stop-color="#e9d8b4"/>
    </linearGradient>
    <linearGradient id="almondLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#dcbe9b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pbBg)"/>
  <rect width="800" height="450" fill="none" stroke="#2d3429" stroke-width="2"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(25, 25)">
    <rect width="750" height="52" rx="8" fill="#282f25" stroke="#363f31" stroke-width="1"/>
    <circle cx="32" cy="26" r="14" fill="url(#leafGrad)"/>
    <path d="M26 31 C26 21 38 21 38 21 C38 21 38 31 26 31 Z" fill="#ffffff" fill-opacity="0.9"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="15" font-weight="600">Consumer Perception &amp; Market Opportunities · Plant-Based Beverages</text>
    <rect x="640" y="14" width="90" height="24" rx="12" fill="#84cc16" fill-opacity="0.15" stroke="#84cc16" stroke-width="1"/>
    <text x="685" y="30" fill="#a3e635" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">October 2025</text>
  </g>

  <!-- Left: Aesthetic Beverage Bottles Presentation -->
  <g transform="translate(25, 95)">
    <rect width="330" height="330" rx="8" fill="#282f25" stroke="#363f31" stroke-width="1"/>
    <text x="20" y="30" fill="#d9f99d" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600">Product Portfolio Evaluated</text>

    <!-- Bottle 1: Oat Milk -->
    <g transform="translate(45, 60)">
      <!-- Glass bottle outline -->
      <rect x="15" y="10" width="18" height="25" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M5 35 L43 35 L48 200 L0 200 Z" rx="8" fill="url(#oatLiquid)"/>
      <path d="M5 35 L43 35 L48 200 L0 200 Z" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <!-- Label -->
      <rect x="6" y="80" width="36" height="60" rx="3" fill="#ffffff" fill-opacity="0.9"/>
      <text x="24" y="105" fill="#1f2937" font-family="'Hanken Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">OAT</text>
      <text x="24" y="120" fill="#4d7c0f" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="600" text-anchor="middle">PURE</text>
      <text x="24" y="225" fill="#e5e7eb" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Oat Milk</text>
      <text x="24" y="240" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Leading Taste</text>
    </g>

    <!-- Bottle 2: Almond Milk -->
    <g transform="translate(135, 45)">
      <!-- Glass bottle outline -->
      <rect x="20" y="8" width="20" height="28" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M8 36 L52 36 L58 215 L2 215 Z" rx="8" fill="url(#almondLiquid)"/>
      <path d="M8 36 L52 36 L58 215 L2 215 Z" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <!-- Label -->
      <rect x="10" y="90" width="40" height="65" rx="3" fill="#ffffff" fill-opacity="0.9"/>
      <text x="30" y="118" fill="#1f2937" font-family="'Hanken Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ALMOND</text>
      <text x="30" y="133" fill="#92400e" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="600" text-anchor="middle">BARISTA</text>
      <text x="30" y="240" fill="#e5e7eb" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Almond</text>
      <text x="30" y="255" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Top Awareness</text>
    </g>

    <!-- Bottle 3: Soy Milk -->
    <g transform="translate(230, 65)">
      <rect x="15" y="10" width="18" height="25" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M5 35 L43 35 L48 195 L0 195 Z" rx="8" fill="#fef3c7" fill-opacity="0.85"/>
      <path d="M5 35 L43 35 L48 195 L0 195 Z" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="6" y="80" width="36" height="55" rx="3" fill="#ffffff" fill-opacity="0.9"/>
      <text x="24" y="105" fill="#1f2937" font-family="'Hanken Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">SOY</text>
      <text x="24" y="118" fill="#166534" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="600" text-anchor="middle">PROTEIN</text>
      <text x="24" y="220" fill="#e5e7eb" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Soy Base</text>
      <text x="24" y="235" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">Nutritional Moat</text>
    </g>
  </g>

  <!-- Right: Perceptual Mapping & Research Framework -->
  <g transform="translate(375, 95)">
    <rect width="400" height="330" rx="8" fill="#282f25" stroke="#363f31" stroke-width="1"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="14" font-weight="600">Perceptual Positioning &amp; Consumer Willingness</text>
    <text x="20" y="48" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="11">Mapping taste acceptance vs price premium elasticities</text>

    <!-- Quadrant Axes -->
    <line x1="40" y1="180" x2="360" y2="180" stroke="#4b5563" stroke-width="1.5"/>
    <line x1="200" y1="70" x2="200" y2="290" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Axis Labels -->
    <text x="360" y="175" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="10" text-anchor="end">High Taste Resonance ➔</text>
    <text x="40" y="175" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="10">◀ Functional Utility</text>
    <text x="205" y="85" fill="#a3e635" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600">▲ Premium Price Willingness</text>
    <text x="205" y="285" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="10">▼ Commodity Sensitivity</text>

    <!-- Quadrant Clusters -->
    <!-- Oat Milk Cluster (High Taste, High Premium) -->
    <circle cx="280" cy="120" r="32" fill="#84cc16" fill-opacity="0.15" stroke="#84cc16" stroke-dasharray="3 3"/>
    <circle cx="280" cy="120" r="7" fill="#84cc16"/>
    <text x="280" y="105" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Oat Cluster</text>
    <text x="280" y="138" fill="#d9f99d" font-family="'Hanken Grotesk', sans-serif" font-size="9" text-anchor="middle">High Adoption</text>

    <!-- Almond Milk Cluster -->
    <circle cx="160" cy="130" r="26" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <circle cx="160" cy="130" r="6" fill="#f59e0b"/>
    <text x="160" y="120" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Almond</text>

    <!-- Soy Cluster -->
    <circle cx="110" cy="220" r="24" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-dasharray="3 3"/>
    <circle cx="110" cy="220" r="6" fill="#3b82f6"/>
    <text x="110" y="210" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Soy</text>

    <!-- White Space Opportunity -->
    <rect x="235" y="200" width="135" height="75" rx="6" fill="#141812" stroke="#84cc16" stroke-width="1"/>
    <text x="245" y="220" fill="#a3e635" font-family="'Hanken Grotesk', sans-serif" font-size="10" font-weight="700">Identified Whitespace:</text>
    <text x="245" y="238" fill="#e5e7eb" font-family="'Hanken Grotesk', sans-serif" font-size="9">Affordable RTD Oat Lattes</text>
    <text x="245" y="252" fill="#9ca3af" font-family="'Hanken Grotesk', sans-serif" font-size="8">High conversion among Gen-Z</text>
    <rect x="245" y="260" width="60" height="12" rx="3" fill="#84cc16"/>
    <text x="275" y="269" fill="#1f2937" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="800" text-anchor="middle">Presentation Deck</text>
  </g>
</svg>